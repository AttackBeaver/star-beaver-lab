<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Star Beaver Lab — открытая лаборатория по кибербезопасности: практика, визуализации и сообщество." />
    <title>Star Beaver Lab</title>

    <!-- Anti-flash: применяем тему ДО загрузки React-бандла.
         Иначе на 1-2 кадра мелькает светлый фон при тёмной теме.
         Должен идти раньше <script type="module"> с бандлом. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage недоступен — оставляем светлую тему */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
